<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>زهرا قجاوند | معماری داخلی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c08;--bg2:#1c130d;--card:#221710;--line:#3a2718;--amber:#ffb45a;--glow:#ff8a3d;--tx:#f3e6d6;--mut:#b09a84;--mx:50%;--my:30%}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.9;overflow-x:clip;max-width:100%;min-height:100vh}
html{overflow-x:hidden;max-width:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle 380px at var(--mx) var(--my),rgba(255,170,80,.22),rgba(255,120,40,.07) 55%,transparent 75%);mix-blend-mode:screen}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.7),transparent 60%)}
#dust{position:fixed;inset:0;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:2}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
main{flex:1 0 auto;width:100%}footer{flex-shrink:0}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 5vw;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(18,12,8,.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:1.1rem;margin-inline-end:auto}
nav{display:flex;gap:6px}
nav a{padding:6px 14px;border-radius:99px;color:var(--mut);transition:.3s}
nav a.on,nav a:hover{color:#1a0f07;background:var(--amber);box-shadow:0 0 22px rgba(255,160,70,.5)}
#burger{display:none;background:none;border:0;color:var(--tx);font-size:1.7rem;cursor:pointer}
#av{position:relative;width:46px;height:46px;border-radius:50%;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#av img,#av .ini{width:38px;height:38px;border-radius:50%;object-fit:cover;position:absolute;inset:4px;background:var(--card);display:grid;place-items:center;font-weight:800;color:var(--amber);pointer-events:none}
#av svg{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
#av circle{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:138;stroke-dashoffset:138}
#av.hold circle{stroke-dashoffset:0;transition:stroke-dashoffset 10s linear}
.wrap{max-width:1100px;margin:auto;padding:0 5vw}
.hero{min-height:88vh;display:grid;place-items:center;text-align:center;position:relative;padding:60px 0 40px}
.lamp{position:absolute;top:0;inset-inline:0;margin:auto;width:120px;height:320px;transform-origin:50% 0;animation:sw 6s ease-in-out infinite;pointer-events:none}
@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.lamp i{position:absolute;left:50%;top:0;width:2px;height:120px;background:#5a4030}
.lamp b{position:absolute;left:50%;top:118px;transform:translateX(-50%);width:70px;height:34px;border-radius:70px 70px 6px 6px;background:linear-gradient(#c8873f,#8a5522)}
.lamp u{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:420px;max-width:90vw;height:520px;background:conic-gradient(from 180deg at 50% 0,transparent 158deg,rgba(255,190,100,.28) 180deg,transparent 202deg);filter:blur(10px);animation:fl 4s infinite;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
@keyframes fl{0%,100%{opacity:1}45%{opacity:.75}50%{opacity:1}70%{opacity:.85}}
.hero h1{font-size:clamp(2.4rem,9vw,5.6rem);font-weight:800;line-height:1.2;letter-spacing:-1px;background:linear-gradient(100deg,#fff2df 20%,var(--amber) 50%,#fff2df 80%);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite;text-shadow:0 0 60px rgba(255,150,60,.3)}
@keyframes sh{to{background-position:-250% 0}}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-content:center;justify-items:center;padding:150px 5vw 30px;min-height:100svh}
.hero>div:not(.lamp){grid-row:1}
.house{grid-row:2;width:100%;max-width:min(600px,72vh*2.3);height:auto;filter:drop-shadow(0 0 40px rgba(255,150,60,.25))}
.house .glow{animation:fl 4s infinite}
.house text{font-family:Vazirmatn,sans-serif;font-size:8.5px;fill:#ffcf8a;opacity:.85;text-anchor:middle}
body{position:relative}
#wire{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
#wire path{fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-width:3}
#wb{stroke:#3a2718}#wl{stroke:var(--amber);filter:drop-shadow(0 0 6px var(--glow))}
#orb{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:radial-gradient(circle,#fff6e0 0 7%,rgba(255,190,100,.85) 15%,rgba(255,130,50,.3) 40%,transparent 70%);pointer-events:none;z-index:3;mix-blend-mode:screen;will-change:transform}
.hero p{color:var(--mut);max-width:560px;margin:14px auto 26px;font-size:1.05rem}
.btn{display:inline-block;padding:11px 26px;border-radius:99px;border:1px solid var(--amber);color:var(--amber);cursor:pointer;background:transparent;font:inherit;transition:.3s}
.btn:hover,.btn.f{background:var(--amber);color:#1a0f07;box-shadow:0 0 30px rgba(255,160,70,.55)}
section{padding:50px 0}
h2{font-size:1.7rem;margin-bottom:22px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.s{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;transition:.35s}
.s:hover{border-color:var(--amber);box-shadow:0 0 26px rgba(255,150,60,.25);transform:translateY(-3px)}
.st{direction:ltr;color:#4d3a2a;letter-spacing:2px;white-space:nowrap}.st .o{color:var(--amber);text-shadow:0 0 8px var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .35s,border-color .35s;transform-style:preserve-3d;will-change:transform}
.card:hover{border-color:var(--amber);box-shadow:0 18px 50px rgba(255,140,50,.22)}
.card .im{aspect-ratio:16/10;background:linear-gradient(135deg,#3a2413,#150d08);display:grid;place-items:center;font-size:2.4rem;color:#6b4b30;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:14px 18px 18px}.card h3{font-size:1.1rem}.card p{color:var(--mut);font-size:.92rem}
.card .more{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;white-space:pre-line;font-size:.92rem}.card.open .more{display:block}
.peek{display:block;position:relative}
.peek::after{content:var(--peek,"مشاهدهٔ همهٔ پروژه‌ها ←");position:absolute;inset:auto 0 0 0;padding:70px 0 14px;text-align:center;font-weight:600;color:var(--amber);background:linear-gradient(transparent,var(--bg) 75%)}
.about{color:var(--mut);max-width:760px}
footer{margin-top:60px;border-top:1px solid var(--line);background:linear-gradient(#120c08,#1f130a);text-align:center;padding:50px 5vw calc(30px + env(safe-area-inset-bottom,0px));position:relative;overflow:hidden}
footer::before{content:"";position:absolute;top:-80px;left:50%;width:380px;height:160px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,160,70,.35),transparent 70%)}
footer h3{font-size:1.5rem}.fl{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
footer small{color:var(--mut)}
.pg{display:none}.pg.on{display:block;animation:in .6s}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.empty{color:var(--mut);padding:20px;border:1px dashed var(--line);border-radius:14px}
/* admin */
#ad{position:fixed;inset:0;z-index:50;background:rgba(10,6,3,.92);backdrop-filter:blur(8px);display:none;overflow:auto;padding:4vw}
#ad.on{display:block}
.box{max-width:820px;margin:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px}
.box input,.box textarea{width:100%;background:#120c08;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;margin:4px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs .btn{padding:6px 16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
.row input{flex:1;min-width:120px}.row .num{max-width:70px;flex:none}
.x{color:#ff7b6b;border-color:#ff7b6b}
.thumb{width:54px;height:40px;border-radius:8px;object-fit:cover;background:#000}
label.up{cursor:pointer}
@media(max-width:720px){#burger{display:block}nav{position:fixed;top:0;inset-inline:0;padding:80px 6vw 24px;flex-direction:column;background:rgba(18,12,8,.97);transform:translateY(-110%);transition:.4s;z-index:-1;border-bottom:1px solid var(--line)}nav.on{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>let S,dirty=false,TOKEN="";
const UI={siteTitle:"زهرا قجاوند | معماری داخلی",brand:"Zahra Ghojavand",navHome:"خانه",navProjects:"پروژه‌ها",navArticles:"مقالات",heroBtn:"مهارت‌های من",aboutTitle:"درباره من",skillsTitle:"مهارت‌ها",recentTitle:"پروژه‌های اخیر",peekText:"مشاهدهٔ همهٔ پروژه‌ها ←",projectsTitle:"پروژه‌های من",articlesTitle:"مقالات من",emptyProjects:"هنوز پروژه‌ای اضافه نشده.",emptyArticles:"هنوز مقاله‌ای اضافه نشده.",linkLabel:"مشاهده",footerTitle:"بیایید فضای بعدی را با هم بسازیم",mailBtn:"ایمیل",githubBtn:"GitHub",footerCopy:"Zahra Ghojavand — طراحی داخلی با نور و گرما"};
const ROOMS=["نشیمن","آشپزخانه","ناهارخوری","اتاق خواب","حمام","کمد","تراس","ورودی"];
const DEF={name:"Zahra Ghojavand",title:"مهندس معماری داخلی",city:"تهران",email:"ghojavandzahra0@gmail.com",github:"https://github.com/your-username",avatar:"",
about:"مهندس معماری داخلی با بیش از ۵ سال تجربه در طراحی و اجرای پروژه‌های مسکونی و تجاری. دارای مهارت‌های قوی در استفاده از نرم‌افزارهای طراحی مانند 3ds Max و AutoCAD و تسلط بر اصول طراحی داخلی و نورپردازی و محوطه‌سازی. توانایی کار در تیم‌های چندرشته‌ای و مدیریت پروژه‌ها از مرحله ایده‌پردازی تا نهایی‌سازی. به دنبال ایجاد فضاهای زیبا و کارآمد هستم که نیازهای مشتریان را برآورده کند. ارتباطات قوی با مشتریان و توجه به جزئیات از ویژگی‌های بارز من است. متعهد به به‌روز نگه‌داشتن دانش و مهارت‌هایم در حوزه معماری داخلی.",
ui:UI,rooms:ROOMS,
skills:[["AutoCAD",5],["Rhino",5],["3D Max",5],["Revit",5],["Adcl",5],["SketchUp",5],["Photoshop",5],["Land scape",5],["Landscape",5],["Commercial Interior Design",5],["Villa Design",5],["Roof Design",5],["Interior & Facade Design",5],["Cabinet Design",5],["Furniture Design",5],["Familiar with modern materials",5],["زبان انگلیسی",4]],
projects:[{title:"ویلای مسکونی",description:"طراحی داخلی و نورپردازی گرم یک ویلا",image:"",body:""},{title:"دفتر تجاری",description:"طراحی فضای کار مدرن و دلباز",image:"",body:""},{title:"طراحی مبلمان",description:"مبلمان و کابینت سفارشی",image:"",body:""}],
articles:[{title:"نورپردازی در فضای داخلی",description:"چگونه نور گرم حس خانه را می‌سازد",body:"متن کامل مقاله را از ادمین پنل یا فایل JSON وارد کنید."}]};
S=structuredClone(DEF);
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^(https?:|mailto:|img\/|data:image\/|\/|#)/i.test(u||"")?u:"#";
